{% set name = "pop" %}
{% set version = "0.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/charmbracelet/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: c577d4f3edf403e34832013b79ddc159c1eec938e0bd452b2623c853f752a75c

build:
  number: 0

requirements:
  build:
    - {{ compiler('go-nocgo') }}
    - go-licenses

test:
  commands:
    - pop --help

about:
  home: https://github.com/charmbracelet/pop
  dev_url: https://github.com/charmbracelet/pop
  license: MIT
  license_file:
    - LICENSE
    - license-files/
  summary: Send emails from your terminal

extra:
  recipe-maintainers:
    - apcamargo
