{% set name = "pop" %}
{% set version = "0.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/charmbracelet/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: b7f68883e55004fd538faa78227afd474e4222e567c5cdd9d6c15f52c2befe45

build:
  number: 0

requirements:
  build:
    - {{ compiler('go-nocgo') }}
    - go-licenses

test:
  commands:
    - pop --help

about:
  home: https://github.com/charmbracelet/pop
  dev_url: https://github.com/charmbracelet/pop
  license: MIT
  license_file:
    - LICENSE
    - license-files/
  summary: Send emails from your terminal

extra:
  recipe-maintainers:
    - apcamargo
